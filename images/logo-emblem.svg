<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="redG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d3122a"/>
      <stop offset="100%" stop-color="#990b22"/>
    </linearGradient>
    <linearGradient id="navyG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2a4d"/>
      <stop offset="100%" stop-color="#041021"/>
    </linearGradient>
    <filter id="bShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#041021" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Badge Background -->
  <rect x="4" y="4" width="92" height="92" rx="20" fill="#ffffff" stroke="url(#redG)" stroke-width="2.5" filter="url(#bShadow)"/>

  <!-- House Roof in Red -->
  <path d="M 50 16 L 82 40 L 76 44 L 50 25 L 24 44 L 18 40 Z" fill="url(#redG)"/>
  <!-- Chimney -->
  <path d="M 67 22 L 74 22 L 74 33 L 67 28 Z" fill="url(#redG)"/>

  <!-- Dark House Body Container -->
  <path d="M 23 44 L 50 25 L 77 44 C 77 44, 78 72, 50 72 C 22 72, 23 44, 23 44 Z" fill="url(#navyG)"/>

  <!-- Refrigerator (Left) -->
  <rect x="29" y="42" width="11" height="23" rx="2" fill="#ffffff"/>
  <line x1="29" y1="51" x2="40" y2="51" stroke="#041021" stroke-width="0.9"/>
  <line x1="38" y1="45" x2="38" y2="49" stroke="#041021" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="38" y1="54" x2="38" y2="60" stroke="#041021" stroke-width="0.9" stroke-linecap="round"/>

  <!-- Washing Machine (Center) -->
  <rect x="42" y="38" width="16" height="27" rx="2" fill="#ffffff"/>
  <circle cx="50" cy="53" r="6" fill="#0e2a4d" stroke="#e2e8f0" stroke-width="1.2"/>
  <circle cx="50" cy="53" r="3.2" fill="url(#redG)"/>
  <line x1="44" y1="42" x2="56" y2="42" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="45.5" cy="40.5" r="0.8" fill="#041021"/>
  <circle cx="48.5" cy="40.5" r="0.8" fill="#041021"/>
  <circle cx="54" cy="40.5" r="1.1" fill="url(#redG)"/>

  <!-- Oven (Right) -->
  <rect x="60" y="44" width="11" height="21" rx="2" fill="#ffffff"/>
  <rect x="61.5" y="50" width="8" height="12" rx="1" fill="#0e2a4d"/>
  <line x1="62" y1="48" x2="69" y2="48" stroke="#041021" stroke-width="0.9"/>
  <circle cx="63" cy="46" r="0.6" fill="url(#redG)"/>
  <circle cx="65.5" cy="46" r="0.6" fill="url(#redG)"/>
  <circle cx="68" cy="46" r="0.6" fill="url(#redG)"/>

  <!-- Curved Dynamic Repair Wrench in Red Wrapping Bottom -->
  <path d="M 14 62 C 14 83, 33 89, 50 89 C 67 89, 85 81, 86 68 C 82 74, 68 81, 50 81 C 34 81, 21 74, 19 62 Z" fill="url(#redG)"/>
  <circle cx="28" cy="71" r="8" fill="url(#redG)"/>
  <polygon points="28,68 32,71 28,74 23,72" fill="#ffffff"/>
</svg>